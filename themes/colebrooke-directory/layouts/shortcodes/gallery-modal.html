<div id="myModal" class="modal" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>

  <button type="button" class="gallery-previous" aria-label="Previous photograph">&#8249;</button>
  <img class="modal-content" id="modal-img" alt="">

  <div id="caption" aria-live="polite"></div>
</div>
